global:
  cloudProvider: {}
  tracing: {}
  metrics: {}
  environment: {}

mclabels:
  component: backend
  partOf: vector-services
  owner: vector
  prometheus:
    enabled: true

environment: development    
enabled: true
replicaCount: 1
revisionHistoryLimit: 5  # Amount of revisions we keep
nodePort: 30030  # for minikube deployment only
resetOnConfigChange: false

podAnnotations: {}


cloudProvider:
  imagePullSecretName: acr-secret
  dockerRegistryUrl: my-registry-url.io
  flavor: openshift

image:
  repository: external-to-osm-tag-mapping
  # Overrides the image tag whose default is the chart appVersion.
  # tag: "v1.0.0"
  pullPolicy: IfNotPresent


resources:
  enabled: false
  value:
    limits:
      cpu: 100m
      memory: 128Mi
    requests:
      cpu: 100m
      memory: 128Mi

env:
  port: 8080
  targetPort: 8080
  protocol: TCP
  logLevel: info
  logPrettyPrintEnabled: false
  responseCompressionEnabled: true
  requestPayloadLimit: 1mb
  hashKey:
    enabled: false
  tracing:
    enabled: false
    url: http://localhost:55681/v1/trace
  metrics:
    enabled: false
    url: http://localhost:55681/v1/metrics
  # dbPrefixkey: 'vector' # add prefix to to db record's key

dbConfig:
  host: redis-master
  port: 6379
  index: 0
  # username: '' #pass '' (empty string) when username is not needed
  # password: '' #pass '' (empty string) when password is not needed
  maxRetriesPerRequest: 0
  connectTimeoutMs: 5000
  tls:
    enabled: false
    # cert: ''
    # key: ''
    # ca: ''

livenessProbe:
  enabled: true
  path: /liveness
  initialDelaySeconds: 60
  timeoutSeconds: 5
  periodSeconds: 10
  failureThreshold: 3


schema: |-
  [
    {
      "name": "system1",
      "createdAt": "2021-07-14T11:19:58Z",
      "updatedAt": "2021-07-14T11:19:58Z",
      "addSchemaPrefix": false,
      "enableExternalFetch": "yes",
      "explodeKeys": ["explode1", "explode2"],
      "explodePrefix": "",
      "domainPrefix": "",
      "renameKeys": { "externalKey1": "explode2" }
    },
    {
      "name": "system2",
      "createdAt": "2021-07-14T11:19:58Z",
      "updatedAt": "2021-07-14T11:19:58Z",
      "addSchemaPrefix": true,
      "enableExternalFetch": "no"
    }
  ]

route:
  enabled: true
  path: /
  host: ''
  timeout:
    enabled: false  # defaults to 30s by openshift
    duration: 60s  # supported units (us, ms, s, m, h, d)
  rewriteTarget: ''
  tls:
    enabled: true
    termination: edge
    insecureEdgeTerminationPolicy: Redirect
    useCerts: false
    certificate: ''
    key: ''
    caCertificate: ''